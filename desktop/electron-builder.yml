# Packaging for the three platforms. Icons are derived from build/icon.png (512 px).
appId: app.slipwright.agent
productName: Slipwright Agent
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
  - "!**/*.map"
asarUnpack:
  - resources/**
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
  hardenedRuntime: true
  # notarization needs an Apple Developer account; see README
  notarize: false
win:
  target: [nsis]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  category: Development
  maintainer: Slipwright

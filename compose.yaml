# Local deployment.
#
#   cp .env.example .env            # API keys (optional: they can be entered in the UI)
#   docker compose up --build -d
#   docker compose exec slipwright slipwright user add ada
#   open http://localhost:8500
#
# One service, SQLite under /data, nothing else to run. That is the right shape when the
# only person whose agents write the build commands is you.
#
# ---------------------------------------------------------------------------------------
# A HOSTED INSTALLATION -- people signing up, each with their own model keys -- needs
# three more things, and none of them is on by default, because turning them on silently
# would change how every existing installation behaves. Put this in `.env`:
#
#   SLIPWRIGHT_SECRET_KEY=...        # generate once; without a stable one, every stored
#                                    # credential is unreadable after a volume rebuild
#   SLIPWRIGHT_DATABASE_URL=postgresql+psycopg://slipwright:slipwright@postgres/slipwright
#   SLIPWRIGHT_RUNNER=docker         # each build runs in a throwaway container
#   SLIPWRIGHT_QUOTA_MAX_RUNNING_JOBS=3
#   SLIPWRIGHT_QUOTA_MAX_PROJECTS=20
#   SLIPWRIGHT_QUOTA_MAX_DISK_MB=5000
#
# then build the runner image, uncomment the docker socket below, and start with the
# database alongside:
#
#   docker build -f Dockerfile.runner -t slipwright-runner:local .
#   docker compose --profile postgres up --build -d
#
# The server waits for PostgreSQL to answer before it migrates, so the two starting
# together is fine.
services:
  slipwright:
    build: .
    image: slipwright:local
    ports:
      - "8500:8500"          # API + web UI
      - "8100-8130:8100-8130" # live environments of jobs (SLIPWRIGHT_PORT_RANGE)
    environment:
      SLIPWRIGHT_STATE_DIR: /data
      SLIPWRIGHT_PORT_RANGE: "8100-8130"
      # Empty means the SQLite file under /data. Point it at a server to use one:
      #   postgresql+psycopg://slipwright:slipwright@postgres/slipwright
      # The `postgres` profile below sets exactly that.
      SLIPWRIGHT_DATABASE_URL: ${SLIPWRIGHT_DATABASE_URL:-}
      # provider keys are optional here; Settings -> Models can store them encrypted
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Set a stable key so stored tokens survive a rebuilt volume; generated in /data
      # otherwise. With PostgreSQL there is no /data to fall back on for a fresh server,
      # so on a hosted installation this is not optional.
      SLIPWRIGHT_SECRET_KEY: ${SLIPWRIGHT_SECRET_KEY:-}
      SLIPWRIGHT_PROVIDER: ${SLIPWRIGHT_PROVIDER:-live}
      # the mounted checkouts, offered as a list on the New project page
      SLIPWRIGHT_LOCAL_REPOS: /repos
      # Where a project's own build and test commands run. `local` is this container,
      # which is right when the agents are yours. A server strangers sign up to must set
      # `docker` -- each command then gets a throwaway container with no network, no
      # privileges and nothing mounted but its own checkout. Build the image first:
      #   docker build -f Dockerfile.runner -t slipwright-runner:local .
      SLIPWRIGHT_RUNNER: ${SLIPWRIGHT_RUNNER:-local}
      SLIPWRIGHT_RUNNER_IMAGE: ${SLIPWRIGHT_RUNNER_IMAGE:-slipwright-runner:local}
      # What one account may take of the machine. Zero means no limit, which is right
      # when the only person who can start twenty developments is you. A server people
      # sign up to should set all three -- it warns in its log if it has not.
      SLIPWRIGHT_QUOTA_MAX_RUNNING_JOBS: ${SLIPWRIGHT_QUOTA_MAX_RUNNING_JOBS:-0}
      SLIPWRIGHT_QUOTA_MAX_PROJECTS: ${SLIPWRIGHT_QUOTA_MAX_PROJECTS:-0}
      SLIPWRIGHT_QUOTA_MAX_DISK_MB: ${SLIPWRIGHT_QUOTA_MAX_DISK_MB:-0}
    volumes:
      - slipwright-state:/data
      # checkouts, kept apart from the state directory so a job's own commands cannot
      # reach the key that decrypts every stored credential
      - slipwright-work:/work
      # local checkouts you want to register as projects: the folder in SLIPWRIGHT_REPOS
      # (default ./repos) is visible inside the container as /repos, so a project at
      # <SLIPWRIGHT_REPOS>/myapp is registered with repo_path = /repos/myapp
      - ${SLIPWRIGHT_REPOS:-./repos}:/repos
      # Required when SLIPWRIGHT_RUNNER=docker: the server asks the host's daemon to
      # start a throwaway container per command. Note what this grants -- access to the
      # daemon is access to the host -- so it is the *server* that is trusted with it,
      # never a job's own command, which only ever sees the inside of its container.
      # - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Only started with `--profile postgres`, so the default single-service setup is
  # unchanged for anybody running this on their own machine.
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slipwright}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slipwright}
      POSTGRES_DB: ${POSTGRES_DB:-slipwright}
    volumes:
      - slipwright-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slipwright}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  slipwright-state:
  slipwright-work:
  slipwright-postgres:

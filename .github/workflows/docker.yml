# Checks every push, and publishes the images people run to GitHub Container Registry.
#
#   main          -> ghcr.io/<owner>/slipwright:latest   (+ :sha-<short>)
#   tag v1.2.3    -> ghcr.io/<owner>/slipwright:1.2.3, :1.2
#                    -- a *release*: running installations offer to install it (update.py)
#   pull request  -> built, never pushed: a stranger's branch does not get to publish
#
# The runner image (Dockerfile.runner) is published beside it as slipwright-runner, so a
# hosted installation can set SLIPWRIGHT_RUNNER_IMAGE instead of building it itself.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# a newer push to the same branch makes the older run pointless
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra postgres
      # A release is offered to every running installation by its number (update.py), and
      # an installation knows its own number from pyproject.toml. A tag that disagrees
      # would be offered forever to the very version it installs.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          have=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$have" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, but pyproject.toml says $have" >&2; exit 1
          fi
      # jobs commit in the tests' scratch repositories; a runner has no git identity
      - run: |
          git config --global user.name slipwright-ci
          git config --global user.email ci@slipwright.invalid
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q

  image:
    # an image nobody could trust is not worth publishing
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: slipwright
            file: Dockerfile
          - name: slipwright-runner
            file: Dockerfile.runner
    steps:
      - uses: actions/checkout@v4
      # arm64 as well, so the image runs natively on Apple Silicon and ARM servers
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

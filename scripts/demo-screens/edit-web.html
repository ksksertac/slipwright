<!doctype html>
<html>
<head>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;
color:#1d2433;background:#f6f7fb}
.tag{display:inline-block;background:#eef1ff;color:#3446c9;border-radius:999px;padding:2px 10px;
font-size:12px;margin:0 6px 0 0}
.primary{background:#3446c9;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;
text-decoration:none;font-size:14px}
input,textarea{font:inherit}

header{display:flex;align-items:center;gap:14px;padding:22px 40px;background:#fff;
border-bottom:1px solid #e6e8f0}header a{color:#6b7390;text-decoration:none}
h1{margin:0;font-size:20px}main{max-width:760px;margin:28px auto;background:#fff;
border:1px solid #e6e8f0;border-radius:14px;padding:28px 32px}
.title{width:100%;font-size:24px;font-weight:600;border:0;outline:0;margin-bottom:14px}
textarea{width:100%;height:230px;border:1px solid #e6e8f0;border-radius:10px;padding:14px;
resize:none;color:#3a4260}label{display:block;font-size:12px;text-transform:uppercase;
letter-spacing:.06em;color:#6b7390;margin:18px 0 8px}.chips{display:flex;gap:6px;align-items:center;
border:1px solid #d9dcea;border-radius:10px;padding:8px 10px}.chips .tag{padding:4px 10px}
.chips input{border:0;outline:0;flex:1;color:#8a91a8}footer{display:flex;justify-content:flex-end;
gap:12px;align-items:center;margin-top:24px}footer a{color:#6b7390}.saved{color:#2e8a57;
font-size:13px;margin-right:auto}</style>
</head>
<body>
<header>
<a>&larr; Notes</a>
<h1>Edit note</h1>
</header>
<main>
<input class="title" value="Standup, Tuesday">
<textarea>Ship search before the demo; tags can follow.

- search covers the title and the body
- the tag list on the left filters
- empty state says to try fewer words</textarea>
<label>Tags</label>
<div class="chips">
<span class="tag">work &times;</span>
<span class="tag">demo &times;</span>
<input value="Add a tag and press Enter">
</div>
<footer>
<span class="saved">Saved 10:24</span>
<a>Cancel</a>
<a class="primary">Save</a>
</footer>
</main>
</body>
</html>
